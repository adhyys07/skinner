<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Card Skinner</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h3>Skinner</h3>
        <img src="/assets/hcb-dark.png" alt="hcb" class="logo">
    </div>
    <p class="subtitle">Pick a theme for your HCB cards</p>

    <div class="scope-switch" role="group" aria-label="Theme scope">
        <button class="scope-btn active" data-scope="global" type="button">Global</button>
        <button class="scope-btn" data-scope="card" type="button">This card</button>
    </div>

    <div class="theme-grid">
        <button class="theme-card" data-theme="glass">
            <div class="preview preview-glass">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Glass</span>
        </button>
        <button class="theme-card" data-theme="neon">
            <div class="preview preview-neon">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Neon</span>
        </button>
        <button class="theme-card" data-theme="retro">
            <div class="preview preview-retro">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Retro</span>
        </button>
        <button class="theme-card" data-theme="gradient">
            <div class="preview preview-gradient">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Gradient</span>
        </button>
        <button class="theme-card" data-theme="holo">
            <div class="preview preview-holo">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Holo</span>
        </button>
        <button class="theme-card" data-theme="minimal">
            <div class="preview preview-minimal">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Minimal</span>
        </button>
        <button class="theme-card" data-theme="minecraft">
            <div class="preview preview-minecraft">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Minecraft</span>
        </button>
        <button class="theme-card" data-theme="animated-gradient">
            <div class="preview preview-animated-gradient">
                <span class="preview-dots">.... .... 4788</span>
            </div>
            <span class="theme-label">Animated</span>
        </button>
    </div>

    <div class="actions">
        <label for="imageUpload" class="upload-btn">
            Upload Custom Image
            <input type="file" id="imageUpload" accept="image/*" />
        </label>
        <div class="image-url-row">
            <input type="url" id="imageUrlInput" placeholder="Image URL" autocomplete="off" />
            <button type="button" id="applyImageUrlBtn">Apply</button>
        </div>
        <button class="off-btn" data-theme="off">Turn Off Overlays</button>
        <button class="reset-card-btn" type="button">Use Global Theme</button>
        <button class="export-btn" type="button">Export Themes</button>
        <label for="importThemeFile" class="import-btn">
            Import Themes
            <input type="file" id="importThemeFile" accept="application/json,.json" />
        </label>
        <div class="advanced-tools">
            <input id="presetNameInput" type="text" placeholder="Preset Name" />
            <button id="savePresetBtn" type="button">Save Preset</button>
            <select id="presetSelect"></select>
            <button id="applyPresetBtn" type="button">Apply Preset</button>

            <button id="randomThemeBtn" type="button">Random Theme</button>
            <button id="randomDailyBtn" type="button">Random Daily</button>

            <button id="saveOrgThemeBtn" type="button">Use Theme for this Org</button>

            <label>
                Banner Sync
                <select id="bannerSyncSelect">
                    <option value="both">Card + Banner</option>
                    <option value="card">Card Only</option>
                    <option value="banner">Banner only</option>
                    <option value="off">Off</option>
                </select>
            </label>
            <label>
                Background
                <input id="editorBgInput" type="color" value="#5865f2" />
            </label>
            <label>
                Text
                <input id="editorTextInput" type="color" value="#ffffff" />
            </label>
            <label>
                Glow
                <input id="editorGlowInput" type="range" min="0" max="40" value="12" />
            </label>

            <button id="saveEditorThemeBtn" type="button">Save Custom Theme</button>
            <button id="copyThemeCodeBtn" type="button">Copy Theme Code</button>
            <input id="themeCodeInput" type="text" placeholder="Paste theme code" />
            <button id="importThemeCodeBtn" type="button">Import Theme Code</button>

            <button id="resetCardBtn" type="button">Reset Card</button>
            <button id="resetOrgBtn" type="button">Reset Org</button>
            <button id="resetImagesBtn" type="button">Reset Images</button>
            <button id="resetEverythingBtn" type="button">Reset Everything</button>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-dot"></span>
        <span id="status">Idle</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
